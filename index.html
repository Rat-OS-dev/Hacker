
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grok Chat</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  background:#101114;
  color:#eee;
  font-family:Arial,sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
}
header {
  padding:18px;
  background:#18191e;
  border-bottom:1px solid #303139;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
h2 { margin:0; font-size:20px; }
small { color:#999; }
#settings {
  padding:12px;
  background:#18191e;
  display:flex;
  gap:8px;
}
input,textarea,button {
  font:inherit;
  border-radius:8px;
  border:1px solid #383941;
  padding:12px;
}
input,textarea {
  background:#222329;
  color:white;
}
#key { flex:1; min-width:0; }
button {
  background:#e9e9e9;
  color:#111;
  cursor:pointer;
  font-weight:bold;
}
button:disabled { opacity:.5; }
#chat {
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
}
.message {
  max-width:850px;
  width:fit-content;
  padding:14px 17px;
  border-radius:12px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.user {
  align-self:flex-end;
  background:#343b52;
}
.bot {
  align-self:flex-start;
  background:#222329;
}
.error { color:#ff7777; }
#composer {
  display:flex;
  gap:10px;
  padding:15px;
  background:#18191e;
  border-top:1px solid #303139;
}
#prompt {
  flex:1;
  resize:none;
  min-height:48px;
  max-height:150px;
}
#status {
  color:#aaa;
  font-size:12px;
  padding:5px 15px;
  background:#18191e;
}
</style>
</head>
<body>

<header>
  <div>
    <h2>Grok Chat</h2>
    <small>Powered by Grok 4.7</small>
  </div>
  <button id="newChat">New chat</button>
</header>

<div id="settings">
  <input id="key" type="password"
    placeholder="Enter your xAI API key">
  <button id="connect">Connect</button>
</div>

<div id="chat">
  <div class="message bot">
    Hello! I'm Grok 4.7. Connect your API key and let's chat.
  </div>
</div>

<div id="status">Not connected</div>

<div id="composer">
  <textarea id="prompt"
    placeholder="Message Grok..."
    disabled></textarea>
  <button id="send" disabled>Send</button>
</div>

<script>
const MODEL = "grok-4.7";

let apiKey = "";
let previousResponseId = null;
let busy = false;

const chat = document.getElementById("chat");
const keyInput = document.getElementById("key");
const prompt = document.getElementById("prompt");
const send = document.getElementById("send");
const status = document.getElementById("status");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

document.getElementById("connect").onclick = () => {
  const key = keyInput.value.trim();

  if (!key) {
    status.textContent = "Enter your API key first.";
    return;
  }

  apiKey = key;
  keyInput.value = "";
  keyInput.disabled = true;

  prompt.disabled = false;
  send.disabled = false;

  status.textContent = "Connected to Grok 4.7";
};

async function sendMessage() {
  const text = prompt.value.trim();

  if (!text || !apiKey || busy) return;

  busy = true;
  send.disabled = true;

  addMessage(text, "user");
  prompt.value = "";

  const loading = addMessage("Thinking...", "bot");

  status.textContent = "Grok is responding...";

  try {
    const body = {
      model: MODEL,
      input: text,
      reasoning: { effort: "high" },
      temperature: 0.7,
      top_p: 0.95
    };

    if (previousResponseId) {
      body.previous_response_id = previousResponseId;
    }

    const response = await fetch(
      "https://api.x.ai/v1/responses",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + apiKey
        },
        body: JSON.stringify(body)
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error?.message || "API error: " + response.status
      );
    }

    const answer = (data.output || [])
      .filter(item => item.type === "message")
      .flatMap(item => item.content || [])
      .filter(part => part.type === "output_text")
      .map(part => part.text)
      .join("\n");

    if (!answer) {
      throw new Error("Grok returned no text response.");
    }

    previousResponseId = data.id;

    loading.textContent = answer;
    status.textContent = "Connected · Grok 4.7";

  } catch (error) {
    loading.textContent = "Error: " + error.message;
    loading.classList.add("error");
    status.textContent = "Request failed";
  }

  busy = false;
  send.disabled = false;
  prompt.focus();
}

send.onclick = sendMessage;

prompt.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

document.getElementById("newChat").onclick = () => {
  previousResponseId = null;
  chat.innerHTML = "";
  addMessage("New conversation started. What's on your mind?", "bot");
  status.textContent = "New conversation · Grok 4.7";
};
</script>

</body>
</html>
